fix_reasoning = "high"

[review.types.full-stack]
template = ".agents/roborev/full-stack.md"
[review.types.full-stack.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.plan-conformance]
template = ".agents/roborev/plan-conformance.md"
[review.types.plan-conformance.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.conventions]
template = ".agents/roborev/conventions.md"
[review.types.conventions.includes]
guidance = ".agents/roborev/guidance.md"

[review.types.simplicity]
template = ".agents/roborev/simplicity.md"
[review.types.simplicity.includes]
guidance = ".agents/roborev/guidance.md"

[review.subagents.full_stack]
agent = "codex"
model = "gpt-6.1-sol"
reasoning = "high"
review_type = "full-stack"

[review.subagents.plan_conformance]
agent = "codex"
model = "gpt-6.1-sol"
reasoning = "high"
review_type = "plan-conformance"

[review.subagents.conventions]
agent = "codex"
model = "gpt-6-luna"
reasoning = "high"
review_type = "conventions"

[review.subagents.simplicity]
agent = "codex"
model = "gpt-6.1-sol"
reasoning = "high"
review_type = "simplicity"

[review.panels.feature_ready]
members = ["full_stack", "plan_conformance", "conventions", "simplicity"]
synthesis_agent = "codex"
synthesis_model = "gpt-6.1-sol"
